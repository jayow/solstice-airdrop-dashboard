name: Slim shadow validation

# Runs daily at 02:00 UTC — well after the Mac launchd 00:00 refresh and the
# Railway slim 00:05 refresh have both finished publishing daily_totals.json.
# Pulls today's Railway slim release, diffs it against the canonical Mac
# daily_totals.json on `main`, and gates on drift (<=0.1%) + walker coverage
# (>=99.5%). On PASS, bumps a streak counter persisted on the
# `shadow-streak` release; on FAIL/MISSING, resets the streak to zero. At
# streak milestones (3, 5, 7 days) comments on a tracking issue so we know
# when slim is safe to cut over to.
#
# Secrets:
#   GITHUB_TOKEN          — auto-provided by Actions; used by gh CLI for
#                           `gh release download/upload` and `gh issue ...`.
#   SHADOW_WEBHOOK_URL    — optional repo secret. If set, the workflow posts
#                           a one-line PASS/FAIL summary to Slack/Discord.

on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC daily
  workflow_dispatch:      # manual re-run for the current UTC day

permissions:
  contents: read    # checkout main + read release assets via gh
  issues: write     # comment on / create the streak tracking issue

jobs:
  shadow-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout main (canonical)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify gh CLI available
        run: gh --version

      - name: Determine today's UTC date
        id: date
        run: |
          DATE=$(date -u +%F)
          echo "Today (UTC): $DATE"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Download today's Railway slim daily_totals.json
        id: download
        run: |
          DATE="${{ steps.date.outputs.date }}"
          mkdir -p tmp
          set +e
          gh release download "daily-results-${DATE}" \
            -p 'daily_totals.json' \
            -O tmp/slim_daily_totals.json 2>&1 | tee tmp/release_download.log
          RC=${PIPESTATUS[0]}
          set -e
          if [ "$RC" -ne 0 ] || [ ! -s tmp/slim_daily_totals.json ]; then
            echo "Railway slim release 'daily-results-${DATE}' not found or empty."
            echo "RAILWAY_MISSING=true" >> "$GITHUB_ENV"
            echo "missing=true" >> "$GITHUB_OUTPUT"
          else
            echo "Downloaded $(du -h tmp/slim_daily_totals.json | cut -f1) from daily-results-${DATE}"
            echo "missing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare canonical vs slim
        id: compare
        if: steps.download.outputs.missing != 'true'
        run: |
          set +e
          python tools/compare_totals.py \
            --local server/daily_totals.json \
            --remote tmp/slim_daily_totals.json \
            --day "${{ steps.date.outputs.date }}" \
            --drift 0.001 \
            --coverage 0.995 \
            --write-report tmp/shadow_report.md \
            | tee tmp/shadow_console.log
          RC=${PIPESTATUS[0]}
          set -e
          echo "compare_exit=$RC" >> "$GITHUB_OUTPUT"
          if [ "$RC" -eq 0 ]; then
            echo "result=PASS" >> "$GITHUB_OUTPUT"
          elif [ "$RC" -eq 2 ]; then
            echo "result=FAIL" >> "$GITHUB_OUTPUT"
          else
            echo "result=ERROR" >> "$GITHUB_OUTPUT"
          fi

      - name: Append report to job summary
        if: always()
        run: |
          {
            echo "# Slim shadow validation — ${{ steps.date.outputs.date }}"
            echo ""
            if [ "${{ steps.download.outputs.missing }}" = "true" ]; then
              echo "**Result: MISSING** — Railway release \`daily-results-${{ steps.date.outputs.date }}\` was not published."
              echo ""
              echo "Investigate Railway logs — slim refresh likely failed."
              echo ""
              echo "Download attempt log:"
              echo '```'
              cat tmp/release_download.log 2>/dev/null || echo "(no log captured)"
              echo '```'
            elif [ -f tmp/shadow_report.md ]; then
              cat tmp/shadow_report.md
            else
              echo "**Result: ERROR** — compare_totals.py did not produce a report."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update shadow-streak state
        id: streak
        if: always()
        run: |
          RESULT="${{ steps.compare.outputs.result }}"
          if [ "${{ steps.download.outputs.missing }}" = "true" ]; then
            RESULT="MISSING"
          fi
          if [ -z "$RESULT" ]; then
            RESULT="ERROR"
          fi
          echo "Result for streak: $RESULT"
          # Defer to the dedicated streak tracker. It is responsible for:
          #   - downloading the current state.json from the `shadow-streak` release
          #   - mutating current_streak_days + history per the result
          #   - re-uploading via `gh release upload --clobber`
          #   - emitting `streak=<N>` to GITHUB_OUTPUT for the milestone step
          if [ -f tools/_slim_test/track_shadow_streak.py ]; then
            python tools/_slim_test/track_shadow_streak.py \
              --result "$RESULT" \
              --date "${{ steps.date.outputs.date }}" \
              --report tmp/shadow_report.md
          else
            echo "::warning::tools/_slim_test/track_shadow_streak.py not present — skipping streak persistence."
            echo "streak=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Milestone notification (streak 3 / 5 / 7)
        if: always() && steps.streak.outputs.streak != ''
        run: |
          STREAK="${{ steps.streak.outputs.streak }}"
          DATE="${{ steps.date.outputs.date }}"
          case "$STREAK" in
            3|5|7) ;;
            *) echo "Streak=$STREAK is not a milestone — skipping issue update."; exit 0 ;;
          esac
          # Locate (or create) the single tracking issue labelled `shadow-validation`.
          ISSUE_NUM=$(gh issue list --label shadow-validation --state open \
            --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -z "$ISSUE_NUM" ]; then
            ISSUE_NUM=$(gh issue create \
              --title "Railway shadow validation: tracking" \
              --label shadow-validation \
              --body "Auto-created tracking issue for Railway slim shadow validation streak." \
              | sed -n 's#.*/issues/\([0-9]*\)#\1#p')
          fi
          BODY="Streak reached **${STREAK}** consecutive PASS day(s) as of ${DATE}.\n\nRun: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ "$STREAK" = "7" ]; then
            BODY="${BODY}\n\n**Ready to cut over** — slim has matched canonical for 7 consecutive days within drift/coverage gates."
            gh issue edit "$ISSUE_NUM" \
              --title "Railway shadow validation: 7-day PASS — ready to cut over" || true
          fi
          printf '%b' "$BODY" | gh issue comment "$ISSUE_NUM" --body-file -

      - name: Webhook notification (optional)
        if: always() && env.SHADOW_WEBHOOK_URL != ''
        env:
          SHADOW_WEBHOOK_URL: ${{ secrets.SHADOW_WEBHOOK_URL }}
        run: |
          RESULT="${{ steps.compare.outputs.result }}"
          if [ "${{ steps.download.outputs.missing }}" = "true" ]; then
            RESULT="MISSING"
          fi
          STREAK="${{ steps.streak.outputs.streak }}"
          DATE="${{ steps.date.outputs.date }}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          MSG="Slim shadow validation ${DATE}: ${RESULT:-UNKNOWN} (streak=${STREAK:-?}) — ${RUN_URL}"
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d "$(python -c "import json,sys; print(json.dumps({'text': sys.argv[1]}))" "$MSG")" \
            "$SHADOW_WEBHOOK_URL" || echo "::warning::webhook post failed (non-fatal)"

      - name: Upload comparison artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-validation-${{ steps.date.outputs.date }}
          path: |
            tmp/slim_daily_totals.json
            tmp/shadow_report.md
            tmp/shadow_console.log
            tmp/release_download.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Fail the job on FAIL / MISSING / ERROR
        if: always()
        run: |
          RESULT="${{ steps.compare.outputs.result }}"
          if [ "${{ steps.download.outputs.missing }}" = "true" ]; then
            RESULT="MISSING"
          fi
          case "$RESULT" in
            PASS) echo "Shadow validation passed."; exit 0 ;;
            *)    echo "shadow validation failed — investigate before merging to launchd cutover"; exit 1 ;;
          esac
