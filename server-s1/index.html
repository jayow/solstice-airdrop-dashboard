<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Solstice S1 Allocations · Hanyon Analytics</title>
<meta name="description" content="On-chain + Clique view of Solstice Season 1 SLX allocations by wallet, cohort, and claim status." />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<style>
:root {
  --ink-50: rgb(232, 232, 237);
  --ink-100: rgb(232, 232, 237);
  --ink-200: rgb(201, 201, 208);
  --ink-300: rgb(155, 155, 163);
  --ink-400: rgb(122, 122, 131);
  --ink-500: rgb(84, 84, 92);
  --ink-700: rgb(40, 40, 46);
  --ink-900: rgb(17, 17, 20);
  --ink-950: rgb(10, 10, 12);
  --accent-200: rgb(253, 230, 138);
  --accent-300: rgb(252, 211, 77);
  --accent-400: rgb(251, 191, 36);
  --accent-500: rgb(245, 158, 11);
  --good-300:  rgb(110, 231, 183);
  --good-400:  rgb(52, 211, 153);
}

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--ink-950); color: var(--ink-100);
             font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
             font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
.tabular { font-variant-numeric: tabular-nums; }
.display { font-family: "Inter", ui-sans-serif, system-ui; font-weight: 600; letter-spacing: -0.02em; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--ink-400); }

main { max-width: 2200px; margin: 0 auto; padding: 64px 24px; }

header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 40px; }
.brand { display: flex; align-items: center; gap: 16px; color: var(--ink-300); }
.brand a { color: inherit; text-decoration: none; transition: color .15s; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; }
.brand a:hover { color: var(--ink-50); }
.brand .sep { color: var(--ink-500); }
.right-links { display: flex; align-items: center; gap: 16px; font-size: 11px; }
.right-links a { color: var(--ink-500); text-decoration: none; text-transform: uppercase; letter-spacing: 0.14em; transition: color .15s; }
.right-links a.featured { color: var(--accent-300); }
.right-links a:hover { color: var(--ink-200); }
.right-links a.featured:hover { color: var(--accent-200); }
.right-links .sep { color: var(--ink-500); }

.hero {
  display: flex;
  flex-direction: column;
  gap: 32px;
  margin-bottom: 56px;
}
@media (min-width: 720px) {
  .hero {
    flex-direction: row;
    justify-content: flex-start;
    align-items: center;
    gap: 56px;
    flex-wrap: wrap;
  }
}

/* Hero stats — all in one row */
.hero-stats { display: flex; align-items: center; gap: 48px; flex-wrap: wrap; }
.hero-stat .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--ink-400); margin-bottom: 10px; }
.hero-stat .v { font-size: 36px; font-weight: 600; letter-spacing: -0.025em; line-height: 1.05; font-variant-numeric: tabular-nums; }
.hero-stat .v .denom { color: var(--ink-500); font-size: 20px; font-weight: 500; margin-left: 6px; }
.hero-stat .v .unit { color: var(--ink-400); font-size: 18px; font-weight: 500; margin-left: 6px; }
.hero-stat .v.accent { color: var(--accent-300); }
.hero-stat .v.good { color: var(--good-300); }
.hero-stat .sub { font-size: 11px; color: var(--ink-500); font-variant-numeric: tabular-nums; margin-top: 6px; max-width: 240px; }
.hero-stat .progress-bar { height: 3px; background: rgba(255,255,255,.05); border-radius: 999px; margin-top: 10px; overflow: hidden; max-width: 240px; }
.hero-stat .progress-bar > div { height: 100%; background: var(--accent-400); border-radius: 999px; transition: width .3s; }

/* Right column: donut + legend, vertically centered */
.donut-wrap {
  display: flex; flex-direction: row; align-items: center; gap: 24px;
  padding: 0;
}
.donut { position: relative; width: 180px; height: 180px; flex-shrink: 0; }
.donut svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.donut-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
.donut-center .v { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.donut-center .l { font-size: 10px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--ink-500); margin-top: 4px; }
.donut-legend {
  display: flex; flex-direction: column; gap: 8px;
  font-size: 12px; font-variant-numeric: tabular-nums;
  min-width: 130px;
}
.donut-legend .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.donut-legend .dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 8px; vertical-align: 1px; }
.donut-legend .lbl { color: var(--ink-300); }
.donut-legend .val { color: var(--ink-100); font-weight: 500; }
.donut-legend .pct { color: var(--ink-500); margin-left: 4px; font-size: 11px; }
.donut .slice { transition: opacity .15s; cursor: default; }
.donut .slice.dim { opacity: 0.25; }

@media (max-width: 720px) {
  .donut-wrap { flex-direction: column; align-items: center; }
  .hero-stat .v { font-size: 40px; }
  .hero-stat .v .denom { font-size: 20px; }
}

section { margin-bottom: 56px; }
section h2 { font-size: 18px; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 16px; }
.section-sub { font-size: 11px; color: var(--ink-500); font-variant-numeric: tabular-nums; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px; }

.surface { background: rgba(255,255,255,.015); border: 1px solid rgba(255,255,255,.06); border-radius: 16px; overflow: hidden; }
.surface > * + * { border-top: 1px solid rgba(255,255,255,.06); }

.controls { display: flex; gap: 8px; padding: 14px 20px; align-items: center; flex-wrap: wrap; }
.controls input, .controls select, .controls button {
  background: rgba(255,255,255,.03); color: var(--ink-100); border: 1px solid rgba(255,255,255,.08);
  padding: 8px 12px; border-radius: 8px; font: inherit; font-size: 12px;
}
.controls input { width: 360px; }
.controls input:focus, .controls select:focus { outline: 1px solid var(--accent-400); border-color: var(--accent-400); }
.controls button { cursor: pointer; transition: background .15s, border-color .15s; }
.controls button:hover { background: rgba(255,255,255,.05); }
.controls .btn-active { background: rgba(245, 158, 11, 0.12); border-color: rgba(245, 158, 11, 0.30); color: var(--accent-200); }

/* Multi-select dropdown — matches the inline dropdown style */
.multiselect { position: relative; display: inline-block; }
.multiselect-toggle {
  background: rgba(255,255,255,.03); color: var(--ink-100);
  border: 1px solid rgba(255,255,255,.08);
  padding: 8px 12px; border-radius: 8px; font: inherit; font-size: 12px;
  cursor: pointer; transition: background .15s, border-color .15s;
}
.multiselect-toggle:hover { background: rgba(255,255,255,.05); }
.multiselect-toggle .ms-summary { color: var(--ink-300); }
.multiselect-toggle .ms-caret { color: var(--ink-500); margin-left: 4px; }
.multiselect.active .multiselect-toggle {
  border-color: rgba(245, 158, 11, 0.30); background: rgba(245, 158, 11, 0.08);
}
.multiselect.active .ms-summary { color: var(--accent-200); }
.multiselect-menu {
  display: none; position: absolute; top: 100%; left: 0; margin-top: 4px;
  background: rgba(15, 17, 22, 0.98); border: 1px solid rgba(255,255,255,.10);
  border-radius: 8px; padding: 6px 0; min-width: 180px;
  box-shadow: 0 8px 24px rgba(0,0,0,.4);
  z-index: 100; max-height: 320px; overflow-y: auto;
}
.multiselect.open .multiselect-menu { display: block; }
.multiselect-item {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 6px 14px; cursor: pointer; font-size: 12px; color: var(--ink-200);
  user-select: none; transition: background .1s;
}
.multiselect-item:hover { background: rgba(255,255,255,.05); }
.multiselect-item .ms-check {
  width: 14px; height: 14px; border: 1px solid rgba(255,255,255,.20); border-radius: 3px;
  display: inline-flex; align-items: center; justify-content: center; font-size: 10px;
  flex-shrink: 0; color: var(--accent-300);
}
.multiselect-item.selected .ms-check {
  background: rgba(245, 158, 11, 0.20); border-color: var(--accent-400);
}
.multiselect-item .ms-count { color: var(--ink-500); font-size: 10px; font-variant-numeric: tabular-nums; }
.multiselect-item.selected .ms-count { color: var(--accent-300); }
.multiselect-item .ms-label { flex: 1; display: flex; align-items: center; gap: 8px; }

table { width: 100%; border-collapse: collapse; font-size: 11px; table-layout: auto; }
th, td { text-align: right; padding: 7px 6px; white-space: nowrap; font-variant-numeric: tabular-nums; }
th { font-weight: 500; color: var(--ink-400); cursor: pointer; user-select: none; text-transform: uppercase; font-size: 9px; letter-spacing: 0.08em; }
th.asc::after  { content: ' ▲'; color: var(--accent-300); }
th.desc::after { content: ' ▼'; color: var(--accent-300); }
td.left, th.left { text-align: left; }
tbody tr { border-top: 1px solid rgba(255,255,255,.04); transition: background .1s; }
tbody tr:hover { background: rgba(255,255,255,.015); }

.wallet { font-family: inherit; font-variant-numeric: tabular-nums; font-size: 13px; }
.wallet a { color: var(--ink-200); text-decoration: none; transition: color .1s; }
.wallet a:hover { color: var(--accent-300); }
.copy-btn { display: inline-flex; align-items: center; justify-content: center;
            width: 18px; height: 18px; margin-left: 6px; padding: 0; vertical-align: -3px;
            background: transparent; border: 1px solid transparent; border-radius: 4px;
            color: var(--ink-400, #6b7280); cursor: pointer; transition: color .12s, background .12s; }
.copy-btn:hover { color: var(--accent-300); background: rgba(255,255,255,0.04); }
.copy-btn:focus-visible { outline: 1px solid var(--accent-300); outline-offset: 1px; }
.copy-btn svg { width: 12px; height: 12px; display: block; }
.copy-btn.copied { color: #4ade80; }
.copy-btn.copied svg { transform: scale(1.1); }

.tag { display: inline-block; padding: 2px 7px; border-radius: 999px; font-size: 9.5px;
       text-transform: uppercase; letter-spacing: 0.06em; border: 1px solid; margin-left: 6px;
       font-variant-numeric: tabular-nums; vertical-align: 1px; }
.tag.cohort { color: var(--ink-200); border-color: rgba(255,255,255,0.12); background: rgba(255,255,255,0.02); }
.tag.S1              { color: var(--accent-300); border-color: rgba(245, 158, 11, 0.30); }
.tag.PRESALE         { color: #a5b4fc; border-color: rgba(165, 180, 252, 0.30); }
.tag.PRESALE_PENDING { color: #a5b4fc; border-color: rgba(165, 180, 252, 0.30); opacity: 0.65; font-style: italic; }
.tag.XEET            { color: #f0abfc; border-color: rgba(240, 171, 252, 0.30); }
.tag.RIVALZ          { color: #67e8f9; border-color: rgba(103, 232, 249, 0.30); }
.tag.EXP             { color: #fda4af; border-color: rgba(253, 164, 175, 0.30); }
.tag.claimed { color: var(--good-300); border-color: rgba(52, 211, 153, 0.25); }
.tag.unclaimed { color: var(--ink-400); border-color: rgba(255,255,255,0.10); }
.tag.dust { color: #fda4af; border-color: rgba(253, 164, 175, 0.3); }
.tag.bhv-HELD { color: var(--good-300); border-color: rgba(52, 211, 153, 0.25); }
.tag.bhv-SOLD { color: #fda4af; border-color: rgba(253, 164, 175, 0.30); }
.tag.bhv-BOUGHT_MORE { color: #a5b4fc; border-color: rgba(165, 180, 252, 0.30); }
.tag.bhv-STAKED { color: var(--accent-300); border-color: rgba(245, 158, 11, 0.30); }

/* Behavior amount columns — colored to match the action */
td.held-c   { color: var(--good-300); }
td.staked-c { color: var(--accent-300); }
td.bought-c { color: #a5b4fc; }
td.sold-c   { color: #fda4af; }

/* Allocation buckets grid */
.buckets-section { margin-bottom: 56px; }
.buckets-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.bucket-card { padding: 14px 16px; background: rgba(255,255,255,.02); border: 1px solid rgba(255,255,255,.06); border-radius: 10px; border-left-width: 3px; }
.bucket-card .name { font-size: 11px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--ink-400); margin-bottom: 6px; }
.bucket-card .amt { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.bucket-card .amt .unit { color: var(--ink-400); font-size: 12px; font-weight: 500; margin-left: 4px; }
.bucket-card .meta { font-size: 11px; color: var(--ink-500); font-variant-numeric: tabular-nums; margin-top: 6px; display: flex; justify-content: space-between; gap: 8px; }
.bucket-card .meta b { color: var(--ink-200); font-weight: 500; }
.bucket-card.b-S1   { border-left-color: var(--accent-300); }
.bucket-card.b-EXP  { border-left-color: #fda4af; }
.bucket-card.b-BN   { border-left-color: var(--good-300); }
.bucket-card.b-PS   { border-left-color: #a5b4fc; }
.bucket-card.b-XT   { border-left-color: #f0abfc; }
.bucket-card.b-RV   { border-left-color: #67e8f9; }

/* Custom tooltip — appears instantly on hover, follows cursor */
#hover-tooltip {
  position: fixed; pointer-events: none; z-index: 9999;
  background: rgba(15, 17, 22, 0.96); border: 1px solid rgba(255,255,255,.12);
  border-radius: 8px; padding: 10px 14px; font-size: 12px; color: var(--ink-100);
  font-variant-numeric: tabular-nums; white-space: pre-line; line-height: 1.5;
  box-shadow: 0 8px 24px rgba(0,0,0,.4); max-width: 320px;
  opacity: 0; transition: opacity .08s;
}
#hover-tooltip.visible { opacity: 1; }

.zero { color: var(--ink-500); }
.muted { color: var(--ink-500); font-size: 11px; }

.pagination { display: flex; gap: 8px; align-items: center; padding: 14px 20px; justify-content: space-between;
              border-top: 1px solid rgba(255,255,255,.06); font-size: 11px; color: var(--ink-400); }
.pagination button { background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.08);
                     color: var(--ink-200); padding: 6px 12px; border-radius: 6px; cursor: pointer; font: inherit; }
.pagination button:disabled { opacity: .35; cursor: default; }

footer { text-align: center; color: var(--ink-500); font-size: 11px; margin-top: 40px; }

/* Progress bar in claimed % stat */
.progress-bar { height: 4px; background: rgba(255,255,255,.05); border-radius: 999px; margin-top: 8px; overflow: hidden; }
.progress-bar > div { height: 100%; background: var(--accent-400); border-radius: 999px; transition: width .3s; }

/* Cohort overview cards */
.cohort-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
.cohort-card { padding: 18px 20px; background: rgba(255,255,255,.02); border: 1px solid rgba(255,255,255,.06); border-radius: 12px; }
.cohort-card .title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--ink-400); }
.cohort-card .big { font-size: 22px; font-weight: 600; margin-top: 8px; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.cohort-card .row { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-400); margin-top: 6px; font-variant-numeric: tabular-nums; }
.cohort-card .row span:last-child { color: var(--ink-200); }
.cohort-card .pop-fetched { color: var(--accent-300); }

@media (max-width: 820px) {
  .controls input { width: 100%; }
  th, td { padding: 8px 10px; }
  /* Hide source-of-allocation cols on mobile */
  th.col-mobile-hide, td.col-mobile-hide { display: none; }
}
</style>
</head>
<body>

<main>
  <header>
    <div class="brand">
      <a href="https://solstice.finance" target="_blank" rel="noopener noreferrer" style="display:inline-flex; align-items:center;">
        <img src="logos/solstice-text.svg" alt="Solstice" style="height: 33px; display:block; filter: invert(1);" />
      </a>
      <span class="sep">·</span>
      <span class="display" style="font-size: 12px; color: var(--ink-400);">
        Unofficial S1 Allocations by
        <a href="https://hanyon.app" target="_blank" rel="noopener noreferrer" style="color: var(--ink-200); text-decoration: underline dotted; text-underline-offset: 3px;">Hanyon Analytics</a>
      </span>
    </div>
    <div class="right-links">
      <a href="https://s2.solstice.hanyon.app/" target="_blank" rel="noopener noreferrer">Season 2 ↗</a>
      <span class="sep">·</span>
      <a href="https://airdrop.solstice.hanyon.app/" target="_blank" rel="noopener noreferrer">Airdrop ↗</a>
      <span class="sep">·</span>
      <a href="https://claim.solstice.finance/" class="featured" target="_blank" rel="noopener noreferrer">Claim ↗</a>
    </div>
  </header>

  <section class="hero">
    <div id="stat-tracked"></div>
    <div id="donut-container"></div>
  </section>

  <div id="hover-tooltip"></div>

  <section>
    <div class="section-head">
      <h2 class="display">Season 1 wallet allocations</h2>
      <span class="section-sub" id="table-sub"></span>
    </div>
    <div class="surface">
      <div class="controls">
        <input id="search" placeholder="Search wallet (pubkey or prefix)…" autocomplete="off"/>
        <select id="claim-filter">
          <option value="">Claim status: any</option>
          <option value="claimed">Claimed</option>
          <option value="unclaimed">Not claimed</option>
        </select>
        <select id="min-alloc-filter" title="Filter wallets by minimum total allocation">
          <option value="0">Min alloc: any</option>
          <option value="1" selected>≥ 1 SLX</option>
          <option value="100">≥ 100 SLX</option>
          <option value="1000">≥ 1,000 SLX</option>
          <option value="10000">≥ 10,000 SLX</option>
          <option value="100000">≥ 100,000 SLX</option>
          <option value="1000000">≥ 1,000,000 SLX</option>
        </select>
        <div class="multiselect" id="tag-multiselect">
          <button class="multiselect-toggle" type="button">Tags: <span class="ms-summary">any</span> <span class="ms-caret">▾</span></button>
          <div class="multiselect-menu" id="tag-multiselect-menu"></div>
        </div>
        <div class="multiselect" id="cohort-multiselect">
          <button class="multiselect-toggle" type="button">Cohorts: <span class="ms-summary">any</span> <span class="ms-caret">▾</span></button>
          <div class="multiselect-menu" id="cohort-multiselect-menu"></div>
        </div>
      </div>
      <table id="t">
        <thead>
          <tr>
            <th data-key="rank" class="left">#</th>
            <th data-key="wallet" class="left">Wallet</th>
            <th data-key="t" class="desc">Total alloc</th>
            <th data-key="l">Liquid (U1)</th>
            <th data-key="u2_3m" title="Estimated Unlock 2 amount on 5 July 2026 — vested × 31/92 (3-month plan)">U2 est. (3m)</th>
            <th data-key="v">Vested</th>
            <th data-key="std">S1 base</th>
            <th data-key="exp">Exponent</th>
            <th data-key="bn">Flares bonus</th>
            <th data-key="ps">Presale</th>
            <th data-key="xt" title="Solstice × Tonso (Xeet) partnership allocation">Xeet</th>
            <th data-key="oth" title="Aggregated partner buckets — currently includes: Rivalz">Others</th>
            <th data-key="held"   title="Liquid SLX still in the wallet">Held</th>
            <th data-key="staked" title="SLX locked in GLAM stSLX">Staked</th>
            <th data-key="bought" title="SLX bought above claimed liquid">Bought</th>
            <th data-key="sold"   title="SLX sold or transferred out">Sold</th>
            <th data-key="snap_ts" title="Latest balance snapshot for this wallet (UTC). Empty = wallet never snapshotted.">Updated</th>
            <th data-key="ca">Claimed</th>
          </tr>
        </thead>
        <tbody id="tb"></tbody>
      </table>
      <div class="pagination">
        <span id="pageinfo"></span>
        <span style="display:flex; gap:8px;">
          <button id="prev">‹ Prev</button>
          <button id="next">Next ›</button>
        </span>
      </div>
    </div>
  </section>

  <footer>Updated <span id="footer-time"></span></footer>
</main>

<script>
const fmt = n => Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtCompact = n => {
  if (n === 0) return '0';
  if (Math.abs(n) >= 1e6) return (n/1e6).toFixed(2)+'M';
  if (Math.abs(n) >= 1e3) return (n/1e3).toFixed(2)+'k';
  return n.toFixed(2);
};
const fmtInt = n => Number(n).toLocaleString(undefined, { maximumFractionDigits: 0 });
const trunc = (s, n=10) => s ? (s.slice(0,n)+'…') : '';
const fmtDateShort = iso => {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  const m = String(d.getUTCMonth()+1).padStart(2,'0');
  const da = String(d.getUTCDate()).padStart(2,'0');
  const h = String(d.getUTCHours()).padStart(2,'0');
  const mi = String(d.getUTCMinutes()).padStart(2,'0');
  return `${m}-${da} ${h}:${mi}`;
};

let DATA = null;
let state = { sort: 't', sortDir: 'desc', page: 1, pageSize: 50, search: '', cohorts: [], tags: [], claim: '', minAlloc: 1 };

async function load() {
  const r = await fetch('data.json?ts='+Date.now());
  DATA = await r.json();
  renderHero();
  populateCohortFilter();
  render();
  document.getElementById('footer-time').textContent = new Date(DATA.meta.generated_at*1000).toUTCString();
}

function renderBuckets() {
  const s = DATA.stats;
  const total = s.sum_total_alloc;
  // Count distinct wallets contributing to each bucket
  const recipients = { std:0, exp:0, bn:0, ps:0, xt:0, rv:0 };

    if (r.exp > 0.01) recipients.exp++;
    if (r.bn  > 0.01) recipients.bn++;
    if (r.ps  > 0.01) recipients.ps++;
    if (r.xt  > 0.01) recipients.xt++;
    if ((r.rv||0) > 0.01) recipients.rv++;
  }
  const buckets = [
    { key:'S1',  name:'S1 base',        amt: s.sum_amt_standard,     expected_pct: 8.5,  n: recipients.std, desc:'amountStandard — main S1 flares allocation' },
    { key:'BN',  name:'Flares bonus',   amt: s.sum_amt_flares_bonus, expected_pct: null, n: recipients.bn,  desc:'Universal 721.28 SLX per real-user wallet' },
    { key:'XT',  name:'Xeet',           amt: s.sum_amt_xeet || 0,    expected_pct: 0.87, n: recipients.xt,  desc:'Tonso × Xeet partnership — top 100 creators' },
    { key:'PS',  name:'Presale',        amt: s.sum_amt_presale,      expected_pct: 0.29, n: recipients.ps,  desc:'Legion presale buyers (Dec 2025)' },
    { key:'EXP', name:'Exponent bonus', amt: s.sum_amt_exponent,     expected_pct: null, n: recipients.exp, desc:'Exponent V2 partner farming bonus' },
    { key:'RV',  name:'Rivalz',         amt: s.sum_amt_rivalz || 0,  expected_pct: null, n: recipients.rv,  desc:'Rivalz Network partnership campaign' },
  ];
  const grid = document.getElementById('buckets-grid');
  grid.innerHTML = buckets.map(b => {
    const pctOfTotal = total > 0 ? (b.amt/total*100).toFixed(2) : 0;
    const pctOfSupply = (b.amt/1e9*100).toFixed(3);
    const target = b.expected_pct ? `target ${b.expected_pct}%` : '';
    return `<div class="bucket-card b-${b.key}" data-tip="${b.desc}">
      <div class="name">${b.name}</div>
      <div class="amt">${fmtCompact(b.amt)} <span class="unit">SLX</span></div>
      <div class="meta"><span>${b.n.toLocaleString()} wallets</span><span><b>${pctOfSupply}%</b> of 1B${target ? ' · '+target : ''}</span></div>

  });
}

        <div class="label">U2 unlock range <span style="color:var(--ink-500); cursor:help;">ⓘ</span></div>

        <div class="sub">5 July 2026 · range = all-9m → all-3m (real number is in between)</div>
      </div>
    </div>`;
  // (Hero tooltip wiring is done below alongside donut tooltips — querySelectorAll('[data-tip]') catches both)

  // Donut chart (right side) — post-claim behavior breakdown
  const order = ['SOLD','HELD','STAKED','BOUGHT_MORE'];
  const colorMap = { SOLD: '#fda4af', HELD: 'var(--good-300)', STAKED: 'var(--accent-300)', BOUGHT_MORE: '#a5b4fc' };
  const labelMap = { SOLD: 'Sold', HELD: 'Held', STAKED: 'Staked', BOUGHT_MORE: 'Bought more' };
  const colorHex = { SOLD: '#fda4af', HELD: '#6ee7b7', STAKED: '#fcd34d', BOUGHT_MORE: '#a5b4fc' };

  const total = order.reduce((s,k) => s + (b[k]?.count || 0), 0);
  if (!total) {
    document.getElementById('donut-container').innerHTML = '';
    return;
  }

  // Build SVG donut. Use pathLength=1 so SVG normalizes the circumference and
  // we work in fractions — eliminates the floating-point bowtie that appeared
  // when 2πR diverged from the rendered path length by a tiny epsilon (the
  // dash pattern was repeating and rendering a tiny second arc at the start).
  const R = 85;
  let acc = 0;
  const slices = order.map(k => {
    const v = b[k]?.count || 0;
    if (!v) return '';
    const frac = v / total;
    const dashOffset = 1 - acc;   // positive shift backward by `acc` aligns slice start

    const tooltip = `${labelMap[k]}: ${fmtInt(v)} wallets (${(frac*100).toFixed(1)}%)\nBalance now: ${fmtCompact(b[k].balance_now)} SLX\nLiquid claimed: ${fmtCompact(b[k].liquid_total)} SLX\nRetention: ${b[k].liquid_total > 0 ? (b[k].balance_now/b[k].liquid_total*100).toFixed(1) : 0}%`;
    return `<circle class="slice" cx="100" cy="100" r="${R}" fill="none"
              stroke="${colorHex[k]}" stroke-width="22"
              pathLength="1"
              stroke-dasharray="${frac} ${1 - frac}"
              stroke-dashoffset="${dashOffset}"
              data-tip="${tooltip.replace(/"/g,'&quot;')}"/>`;
  }).join('');

  const legend = order.filter(k => b[k]).map(k => {
    const v = b[k].count;
    const pct = (v/total*100).toFixed(1);
    return `<div class="row">
      <div><span class="dot" style="background:${colorHex[k]};"></span><span class="lbl">${labelMap[k]}</span></div>
      <div><span class="val">${fmtInt(v)}</span><span class="pct">${pct}%</span></div>
    </div>`;
  }).join('');

  const snapTs = s.last_balance_snapshot_ts;
  const snapStr = snapTs ? new Date(snapTs*1000).toISOString().slice(0,16).replace('T',' ') + ' UTC' : '';
  document.getElementById('donut-container').innerHTML = `
    <div class="donut-wrap">
      <div class="donut" data-tip="Post-claim behavior across ${fmtInt(total)} wallets that have claimed.\nLast snapshot: ${snapStr}">
        <svg viewBox="0 0 200 200">${slices}</svg>
        <div class="donut-center">
          <div class="v">${fmtInt(total)}</div>
          <div class="l">Post-claim</div>
        </div>
      </div>
      <div class="donut-legend">${legend}</div>
    </div>`;

  // Wire tooltips
  const tip = document.getElementById('hover-tooltip');
  document.querySelectorAll('[data-tip]').forEach(el => {
    el.addEventListener('mouseenter', e => {
      tip.textContent = el.dataset.tip;
      tip.classList.add('visible');
    });
    el.addEventListener('mousemove', e => {
      tip.style.left = (e.clientX + 14) + 'px';
      tip.style.top  = (e.clientY + 14) + 'px';
    });
    el.addEventListener('mouseleave', () => tip.classList.remove('visible'));
  });
}

function getTagOptions() {
  const TAG_ORDER = ['S1','PRESALE','XEET','RIVALZ','EXP'];
  const counts = {};
  for (const r of DATA.rows) for (const t of (r.tags||[])) counts[t] = (counts[t]||0)+1;
  // Count under the current min-alloc filter so cohort 1 shows 9 (dust excluded) not 12
  const eligible = {};
  for (const r of DATA.rows) {
    if (r.t < state.minAlloc) continue;
    for (const t of (r.tags||[])) eligible[t] = (eligible[t]||0)+1;
  }
  return TAG_ORDER.filter(t => counts[t]).map(t => ({value: t, label: t, count: eligible[t]||0, total: counts[t]}));
}

function getCohortOptions() {
  const counts = {};
  const eligible = {};
  for (const r of DATA.rows) {
    const c = r.c || '(none)';
    counts[c] = (counts[c]||0)+1;
    if (r.t >= state.minAlloc) eligible[c] = (eligible[c]||0)+1;
  }
  const keys = Object.keys(counts).sort((a,b) => {
    if (a === '(none)') return 1; if (b === '(none)') return -1;
    return a.localeCompare(b);
  });
  return keys.map(c => ({value: c, label: c==='(none)' ? '— uncohort' : `Cohort ${c}`, count: eligible[c]||0, total: counts[c]}));
}

function buildMultiSelect(rootId, menuId, stateKey, options) {
  const root = document.getElementById(rootId);
  const menu = document.getElementById(menuId);
  const toggle = root.querySelector('.multiselect-toggle');
  const summary = root.querySelector('.ms-summary');

  menu.innerHTML = options.map(o => {
    const sel = state[stateKey].includes(o.value);
    const countLabel = (o.count !== o.total) ? `${o.count} <span style="opacity:.45">/ ${o.total}</span>` : `${o.count}`;
    return `<div class="multiselect-item${sel?' selected':''}" data-value="${o.value}">
      <div class="ms-label"><span class="ms-check">${sel?'✓':''}</span>${o.label}</div>
      <span class="ms-count">${countLabel}</span>
    </div>`;
  }).join('');

  const refresh = () => {
    const n = state[stateKey].length;
    summary.textContent = n === 0 ? 'any' : (n === 1 ? state[stateKey][0] : `${n} selected`);
    root.classList.toggle('active', n > 0);
  };
  refresh();

  toggle.onclick = (e) => {
    e.stopPropagation();
    document.querySelectorAll('.multiselect.open').forEach(el => { if (el !== root) el.classList.remove('open'); });
    root.classList.toggle('open');
  };
  menu.querySelectorAll('.multiselect-item').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const v = el.dataset.value;
      const idx = state[stateKey].indexOf(v);
      if (idx >= 0) state[stateKey].splice(idx, 1);
      else state[stateKey].push(v);
      el.classList.toggle('selected');
      el.querySelector('.ms-check').textContent = state[stateKey].includes(v) ? '✓' : '';
      refresh();
      state.page = 1; render();
    });
  });
}

function filterRows() {
  return DATA.rows.filter(r => {
    if (state.minAlloc > 0 && r.t < state.minAlloc) return false;
    if (state.cohorts.length && !state.cohorts.includes(r.c || '(none)')) return false;
    if (state.tags.length) {
      const rowTags = r.tags || [];
      if (!state.tags.some(t => rowTags.includes(t))) return false;
    }
    if (state.claim === 'claimed' && !r.ca) return false;
    if (state.claim === 'unclaimed' && r.ca) return false;
    if (state.search) {
      const q = state.search.toLowerCase();
      if (!r.w.toLowerCase().includes(q)) return false;
    }
    return true;
  });
}

function sortRows(rows) {
  const k = state.sort, d = state.sortDir === 'asc' ? 1 : -1;
  return [...rows].sort((a,b) => {
    let av = a[k], bv = b[k];
    if (k === 'wallet') { av = a.w; bv = b.w; }
    if (k === 'rank')   { return 0; }  // already in this order
    if (typeof av === 'string' || typeof bv === 'string') {
      av = av || ''; bv = bv || '';
      return d * av.localeCompare(bv);
    }
    return d * ((av||0) - (bv||0));
  });
}

function render() {
  const filtered = filterRows();
  const sorted = sortRows(filtered);
  const start = (state.page - 1) * state.pageSize;
  const slice = sorted.slice(start, start + state.pageSize);

  const tbody = document.getElementById('tb');
  tbody.innerHTML = slice.map((r,i) => {
    const rank = start + i + 1;
    const dustClass = r.t < 1 ? 'dust' : '';
    const cohortTag = r.c ? `<span class="tag cohort">C${r.c}</span>` : '';
    const tagPills = (r.tags || []).map(t => `<span class="tag ${t}">${t}</span>`).join('');
    const claimTag = r.ca
      ? `<span class="tag claimed">✓ ${fmtDateShort(r.ca)}</span>`
      : `<span class="tag unclaimed">unclaimed</span>`;
    const bhvLabel = { HELD:'held', SOLD:'sold', BOUGHT_MORE:'bought', STAKED:'staked' }[r.cat] || r.cat?.toLowerCase();
    const bhvTag = r.cat ? `<span class="tag bhv-${r.cat}" title="Primary action · dpct=${r.dpct!=null ? r.dpct.toFixed(1) : '?'}% of liquid">${bhvLabel}</span>` : '';
    // Behavior amount cells — show '—' when zero or null
    const amtCell = (v, cls='') => {
      if (v == null) return '<td class="zero">—</td>';
      if (v < 0.01) return '<td class="zero">—</td>';
      return `<td class="${cls}">${fmt(v)}</td>`;
    };
    return `<tr class="${dustClass}">
      <td class="left">${rank}</td>
      <td class="left wallet">
        <a href="https://solscan.io/account/${r.w}" target="_blank" rel="noopener noreferrer">${trunc(r.w, 10)}</a><button class="copy-btn" data-copy="${r.w}" title="Copy address" aria-label="Copy wallet address"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
        ${tagPills}${cohortTag}
      </td>
      <td><b>${fmt(r.t)}</b></td>
      <td>${r.l > 0.01 ? fmt(r.l) : '<span class="zero">—</span>'}</td>
      <td title="9m alt: ${fmt(r.u2_9m || 0)}">${(r.u2_3m||0) > 0.01 ? fmt(r.u2_3m) : '<span class="zero">—</span>'}</td>
      <td>${r.v > 0.01 ? fmt(r.v) : '<span class="zero">—</span>'}</td>
      <td>${r.std > 0.01 ? fmt(r.std) : '<span class="zero">—</span>'}</td>
      <td>${r.exp > 0.01 ? fmt(r.exp) : '<span class="zero">—</span>'}</td>
      <td>${r.bn > 0.01 ? fmt(r.bn) : '<span class="zero">—</span>'}</td>
      <td>${r.ps > 0.01 ? fmt(r.ps) : '<span class="zero">—</span>'}</td>
      <td>${r.xt > 0.01 ? fmt(r.xt) : '<span class="zero">—</span>'}</td>
      <td title="Rivalz: ${fmt(r.rv || 0)}">${(r.rv||0) > 0.01 ? fmt(r.rv) : '<span class="zero">—</span>'}</td>
      ${amtCell(r.held, 'held-c')}
      ${amtCell(r.staked, 'staked-c')}
      ${amtCell(r.bought, 'bought-c')}
      ${amtCell(r.sold, 'sold-c')}
      <td title="${r.snap_ts ? new Date(r.snap_ts*1000).toISOString().replace('T',' ').slice(0,19)+' UTC' : 'No snapshot'}">${
        r.snap_ts
          ? new Date(r.snap_ts*1000).toISOString().slice(0,10)
          : '<span class="zero">—</span>'
      }</td>
      <td>${claimTag}</td>
    </tr>`;
  }).join('');

  // Update th sort markers
  document.querySelectorAll('th').forEach(th => {
    th.classList.remove('asc','desc');
    if (th.dataset.key === state.sort) th.classList.add(state.sortDir);
  });

  // Pagination
  const totalPages = Math.max(1, Math.ceil(sorted.length / state.pageSize));
  document.getElementById('pageinfo').textContent = `${sorted.length.toLocaleString()} rows · page ${state.page} / ${totalPages}`;
  document.getElementById('prev').disabled = state.page <= 1;
  document.getElementById('next').disabled = state.page >= totalPages;

  document.getElementById('table-sub').textContent = `Showing ${sorted.length.toLocaleString()} of ${DATA.rows.length.toLocaleString()} fetched · ${DATA.stats.fetched_pct}% sweep coverage`;

  // Wire copy buttons (idempotent re-bind every render)
  tbody.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.preventDefault(); e.stopPropagation();
      const addr = btn.dataset.copy;
      try {
        await navigator.clipboard.writeText(addr);
        const orig = btn.innerHTML;
        btn.classList.add('copied');
        btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
        setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = orig; }, 1200);
      } catch (err) {
        // Fallback for older browsers / non-https contexts
        const t = document.createElement('textarea');
        t.value = addr; document.body.appendChild(t); t.select();
        try { document.execCommand('copy'); } catch(_) {}
        document.body.removeChild(t);
      }
    });
  });
}

  document.getElementById('search').addEventListener('input', e => { state.search = e.target.value; state.page = 1; render(); });
  document.getElementById('claim-filter').addEventListener('change', e => { state.claim = e.target.value; state.page = 1; render(); });
  document.getElementById('min-alloc-filter').addEventListener('change', e => { state.minAlloc = Number(e.target.value); state.page = 1; populateCohortFilter(); render(); });
  document.getElementById('prev').addEventListener('click', () => { if (state.page > 1) { state.page--; render(); } });
  document.getElementById('next').addEventListener('click', () => { state.page++; render(); });
  document.querySelectorAll('th[data-key]').forEach(th => {
    th.addEventListener('click', () => {
      const k = th.dataset.key;
      if (state.sort === k) state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
      else { state.sort = k; state.sortDir = (k === 'wallet') ? 'asc' : 'desc'; }
      state.page = 1; render();
    });
  });
});
</script>

</body>
</html>
